version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Mexico_City  # Cambia esto a tu zona horaria si es necesario
      - TZ=America/Mexico_City
      - N8N_SECURE_COOKIE=false
    volumes:
      # Esto guarda todo en D:\PROYECTOS\n8n-host\n8n_data
      - ./n8n_data:/home/node/.n8n

volumes:
  n8n_data: