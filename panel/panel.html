<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de ventas</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #e4e2dc; --col: #efede8;
  --accent: #0f766e; --accent-text: #ffffff; --danger: #b42318;
  --rev-bg: #fdecea; --rev-fg: #b42318;
  --rep-bg: #fff4dc; --rep-fg: #9a5b00;
  --conf-bg: #e6f0ff; --conf-fg: #1d4ed8;
  --nueva-bg: #efefed; --nueva-fg: #4b4a46;
  --pag-bg: #e3f6ec; --pag-fg: #146c43;
  --canc-bg: #f1eff4; --canc-fg: #6b5e7a;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --card: #1e1e1c; --text: #ecebe7; --muted: #a09e98; --line: #33322f; --col: #191918;
    --accent: #2dd4bf; --accent-text: #08201d; --danger: #f87171;
    --rev-bg: #3a1d1b; --rev-fg: #fca5a5;
    --rep-bg: #3a2c12; --rep-fg: #fcd34d;
    --conf-bg: #1b2a44; --conf-fg: #93c5fd;
    --nueva-bg: #2a2a28; --nueva-fg: #d6d4ce;
    --pag-bg: #15342a; --pag-fg: #86efac;
    --canc-bg: #2b2633; --canc-fg: #c4b5fd;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
[hidden] { display: none !important; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }
.sub, .hint { color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
.btn.confirmar { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .55; cursor: default; }
.campo { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; min-height: 40px; }
.fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fila > input, .fila > select { flex: 1 1 140px; min-width: 0; }

/* Encabezado y live */
header.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
header.top h1 { font-size: 20px; margin: 0; flex: 1; letter-spacing: -.01em; }
.livebar { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 12px; display: grid; gap: 10px; }
.livebar .fila select { flex: 1 1 260px; }
.estado-live { font-weight: 600; font-size: 13px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.estado-live.vivo { background: var(--rev-bg); color: var(--rev-fg); }
.estado-live.cerrado { background: var(--nueva-bg); color: var(--nueva-fg); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 12px; }

/* Pestañas */
.tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tab { border: none; background: none; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 600; }
.tab.activa { color: var(--text); border-bottom-color: var(--accent); }

/* Tablero */
.tablero { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.columna { background: var(--col); border-radius: 14px; padding: 10px; min-height: 160px; border: 2px dashed transparent; transition: border-color .15s; }
.columna.sobre { border-color: var(--accent); }
.columna h2 { font-size: 14px; margin: 2px 4px 10px; display: flex; justify-content: space-between; }
.columna .cards { display: grid; gap: 8px; }
.cardc { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); cursor: grab; text-align: left; width: 100%; display: grid; gap: 4px; }
.cardc:hover { border-color: var(--muted); }
.cardc.arrastrando { opacity: .5; }
.cardc .linea { display: flex; justify-content: space-between; gap: 8px; }
.cardc .nombre { font-weight: 600; overflow-wrap: anywhere; }
.cardc .monto { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cardc .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.vacio { text-align: center; color: var(--muted); padding: 24px 12px; font-size: 14px; }
.cerradas { margin-top: 12px; }
.cerradas summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 4px; }

.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.e-requiere_revision, .b-rev { background: var(--rev-bg); color: var(--rev-fg); }
.e-pago_reportado, .b-rep { background: var(--rep-bg); color: var(--rep-fg); }
.e-confirmada, .e-abierta, .b-conf { background: var(--conf-bg); color: var(--conf-fg); }
.e-nueva { background: var(--nueva-bg); color: var(--nueva-fg); }
.e-pagada, .e-verificado { background: var(--pag-bg); color: var(--pag-fg); }
.e-parcial, .e-reportado { background: var(--rep-bg); color: var(--rep-fg); }
.e-cancelada, .e-vencida { background: var(--canc-bg); color: var(--canc-fg); }

/* Lista de compras */
.buscar { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.filtros { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.chip.activo { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.lista { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.item .nick { font-weight: 600; overflow-wrap: anywhere; }
.item .precio { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.item .meta { color: var(--muted); font-size: 13px; }

/* Reporte */
.tabla { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; font-size: 14px; }
.tabla th, .tabla td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
.tabla td.num, .tabla th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabla-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }

/* Login */
.login { max-width: 400px; margin: 12vh auto 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.login h1 { margin: 0 0 6px; font-size: 20px; }
.login input { width: 100%; margin: 14px 0 10px; }
.login .error { color: var(--danger); font-size: 14px; min-height: 20px; }

/* Paneles laterales */
dialog.lateral { width: min(760px, 100vw); max-height: 100dvh; height: 100dvh; margin: 0 0 0 auto; padding: 0; border: none; border-left: 1px solid var(--line); background: var(--bg); color: var(--text); }
dialog.lateral::backdrop, dialog.modal::backdrop { background: rgba(0,0,0,.35); }
.det-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.det-head h2 { margin: 0; font-size: 18px; flex: 1; overflow-wrap: anywhere; }
.det-body { padding: 16px; display: grid; gap: 14px; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.sec h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.aviso { border-radius: 10px; padding: 10px 12px; background: var(--rev-bg); color: var(--rev-fg); font-size: 14px; }
.aviso ul { margin: 6px 0 0; padding-left: 18px; }
.ok-nota { border-radius: 10px; padding: 10px 12px; background: var(--pag-bg); color: var(--pag-fg); font-size: 14px; }
.subcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
.subcard + .subcard { margin-top: 8px; }
.img-caja img { max-width: 100%; max-height: 420px; border-radius: 8px; border: 1px solid var(--line); display: block; }
.chat { display: grid; gap: 6px; max-height: 360px; overflow-y: auto; padding: 4px; }
.burbuja { max-width: 85%; padding: 6px 10px; border-radius: 10px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.burbuja.entrante { background: var(--bg); border: 1px solid var(--line); justify-self: start; }
.burbuja.saliente { background: var(--conf-bg); color: var(--conf-fg); justify-self: end; }
.burbuja time { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.hist li { border-left: 3px solid var(--line); padding-left: 10px; }
.acciones { display: grid; gap: 12px; }
.accion { display: grid; gap: 8px; }
.accion + .accion { border-top: 1px solid var(--line); padding-top: 12px; }

dialog.modal { width: min(460px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); padding: 20px; }
dialog.modal h2 { margin: 0 0 8px; font-size: 18px; }
dialog.modal .acciones-modal { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
dialog.modal label { display: block; margin-top: 10px; font-size: 14px; }
dialog.modal input[type=text], dialog.modal input[inputmode] { width: 100%; margin-top: 4px; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 50; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; max-width: calc(100vw - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 14px; }
.toast.err { background: var(--danger); color: #fff; }

@media (max-width: 900px) {
  .tablero { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .wrap { padding: 12px 16px; }
  header.top h1 { flex-basis: 100%; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 6px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>

<section id="vista-login" class="wrap" hidden>
  <form class="login" id="form-login">
    <h1>Panel de ventas</h1>
    <div class="sub">Escribe la clave del panel para entrar.</div>
    <input class="campo" id="input-clave" type="password" autocomplete="current-password" placeholder="Clave del panel (pk_…)" required>
    <div class="error" id="login-error"></div>
    <button class="btn primary" type="submit" style="width:100%">Entrar</button>
  </form>
</section>

<section id="vista-app" class="wrap" hidden>
  <header class="top">
    <h1>Panel de ventas</h1>
    <span class="sub" id="actualizado"></span>
    <button class="btn" id="btn-recargar" type="button">Actualizar</button>
    <button class="btn" id="btn-salir" type="button">Salir</button>
  </header>

  <section class="livebar" aria-label="Live">
    <div class="fila">
      <select class="campo" id="sel-live" aria-label="Live a mostrar"></select>
      <span class="estado-live" id="estado-live"></span>
      <button class="btn primary" type="button" id="btn-live"></button>
    </div>
    <div class="kpis" id="kpis"></div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab activa" type="button" data-tab="tablero">Tablero</button>
    <button class="tab" type="button" data-tab="compras">Compras</button>
    <button class="tab" type="button" data-tab="reporte">Reporte</button>
  </nav>

  <section id="tab-tablero">
    <div class="tablero" id="tablero"></div>
    <details class="cerradas" id="cerradas"><summary></summary><div class="cards lista" style="margin-top:8px"></div></details>
    <p class="hint">Arrastra una cuenta entre columnas para cambiarla (se pide confirmación). En el celular, tócala y usa los botones del detalle.</p>
  </section>

  <section id="tab-compras" hidden>
    <nav class="filtros" id="filtros" aria-label="Filtrar compras por estado"></nav>
    <input class="buscar" id="buscar" type="search" placeholder="Buscar por nickname o WhatsApp">
    <div class="lista" id="lista"></div>
  </section>

  <section id="tab-reporte" hidden>
    <div class="fila" style="margin-bottom:12px">
      <span class="sub" style="flex:1">Resumen del live seleccionado arriba.</span>
      <button class="btn" type="button" id="btn-csv">Descargar CSV</button>
    </div>
    <div id="reporte"></div>
  </section>
</section>

<dialog class="lateral" id="dlg-cuenta" aria-labelledby="cuenta-titulo">
  <div class="det-head"><h2 id="cuenta-titulo">Cuenta</h2><button class="btn" type="button" data-cerrar>Cerrar</button></div>
  <div class="det-body" id="cuenta-body"></div>
</dialog>

<dialog class="lateral" id="dlg-compra" aria-labelledby="compra-titulo">
  <div class="det-head"><h2 id="compra-titulo">Compra</h2><button class="btn" type="button" data-cerrar>Cerrar</button></div>
  <div class="det-body" id="compra-body"></div>
</dialog>

<dialog class="modal" id="dlg-confirmar">
  <form method="dialog" id="form-confirmar">
    <h2 id="conf-titulo"></h2>
    <div id="conf-texto" class="sub"></div>
    <div id="conf-campos"></div>
    <label>Nota (opcional)<input class="campo" type="text" id="conf-nota"></label>
    <div class="acciones-modal">
      <button class="btn" value="cancelar" type="submit">Cancelar</button>
      <button class="btn primary" value="ok" type="submit" id="conf-ok">Confirmar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const API = '/webhook/panel';
const ESTADOS = {
  requiere_revision: 'Requiere revisión', pago_reportado: 'Pago reportado', confirmada: 'Confirmada',
  nueva: 'Nueva', pagada: 'Pagada', cancelada: 'Cancelada',
};
const ESTADOS_CUENTA = { abierta: 'Abierta', parcial: 'Pago parcial', pagada: 'Pagada', cancelada: 'Cancelada', vencida: 'Vencida' };
const ESTADOS_PAGO = { reportado: 'Por verificar', requiere_revision: 'En revisión', verificado: 'Verificado' };
const COLUMNAS = [
  { id: 'pendientes', titulo: 'Pendientes de pago' },
  { id: 'revision', titulo: 'Por revisar' },
  { id: 'pagadas', titulo: 'Pagadas' },
];
const ORDEN_FILTROS = ['', 'requiere_revision', 'pago_reportado', 'confirmada', 'nueva', 'pagada', 'cancelada'];
// Motivos de revisión en lenguaje neutro: describen el dato, nunca acusan al cliente.
const MOTIVOS = {
  referencia_duplicada: 'La referencia del comprobante ya aparece en otro pago',
  monto_mayor: 'El monto es mayor a lo que debe',
  monto_no_coincide: 'El monto no coincide con lo que debe',
  receptor_distinto: 'El destinatario no parece ser la titular del QR',
  sin_compra_confirmada: 'El cliente no tenía compras confirmadas por pagar',
  comprobante_ilegible: 'No se pudo leer bien el comprobante',
};
const ACCIONES = {
  marcar_pagada: 'Marcada como pagada', cambiar_estado: 'Cambio de estado', editar: 'Edición',
  confirmar_pago: 'Pago confirmado', devolver_agente: 'Devuelta al agente', tomar_conversacion: 'Conversación tomada',
  reenviar_qr: 'QR reenviado', cliente_editar: 'Datos del cliente', vencimiento: 'Vencida por falta de pago',
  cancelada_por_cliente: 'Cancelada por el cliente',
};

const $ = (id) => document.getElementById(id);
const estado = { clave: '', tab: 'tablero', live: '', lives: [], cuentas: [], filtro: '', compras: [], resumen: null, cuentaAbierta: null, compraAbierta: null };

// --- Clave ---
// n8n sirve esta página en un sandbox donde localStorage no está disponible. En ese caso
// la clave se guarda en el enlace (#k=…), que nunca se envía al servidor: basta con
// guardar el enlace como marcador para no volver a escribirla.
function leerClave() {
  try { const v = localStorage.getItem('panel_clave'); if (v) return v; } catch {}
  return new URLSearchParams(location.hash.slice(1)).get('k') || '';
}
function guardarClave(v) {
  try { v ? localStorage.setItem('panel_clave', v) : localStorage.removeItem('panel_clave'); return; } catch {}
  try { history.replaceState(null, '', v ? '#k=' + encodeURIComponent(v) : location.pathname); } catch {}
}

// --- Utilidades ---
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function bs(n) {
  if (n === null || n === undefined || n === '') return '—';
  const v = Number(n);
  return (Number.isInteger(v) ? v : v.toFixed(2)) + ' Bs';
}
// La base guarda las fechas en UTC sin zona; se muestran en la hora local.
function aFecha(v) { return new Date(/Z|[+-]\d\d:?\d\d$/.test(v) ? v : v + 'Z'); }
function fecha(v) {
  if (!v) return '—';
  const d = aFecha(v);
  if (isNaN(d)) return esc(v);
  return d.toLocaleString('es-BO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function dia(v) {
  if (!v) return '—';
  const [a, m, d] = String(v).slice(0, 10).split('-');
  return d + '/' + m + '/' + a;
}
function hace(v) {
  if (!v) return '';
  const s = Math.round((Date.now() - aFecha(v)) / 1000);
  if (s < 60) return 'hace un momento';
  if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';
  return fecha(v);
}
function badge(e, mapa = ESTADOS) { return `<span class="badge e-${esc(e)}">${esc(mapa[e] || e)}</span>`; }
function motivosLista(m) { return String(m || '').split(',').map((s) => s.trim()).filter(Boolean).map((k) => MOTIVOS[k] || k); }
let toastTimer;
function toast(msg, error = false) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (error ? ' err' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, error ? 6000 : 3500);
}
const ERRORES = {
  ya_hay_un_live_activo: 'Ya hay un live activo. Ciérralo antes de abrir otro.',
  no_hay_live_activo: 'No hay un live activo.',
  pago_ya_verificado: 'Ese pago ya estaba confirmado.',
  monto_requerido: 'Indica el monto que recibiste.',
  sin_saldo_pendiente: 'El cliente no tiene saldo pendiente.',
  cuenta_no_encontrada: 'La cuenta ya no existe.',
  cliente_no_encontrado: 'No se encontró el cliente.',
  precio_invalido: 'El precio no es válido.',
  precio_bloqueado: 'El precio no se puede cambiar en este estado.',
  nada_que_editar: 'Escribe un nickname o un precio.',
  compra_no_encontrada: 'La compra ya no existe.',
  estado_no_permitido: 'Ese cambio de estado no está permitido.',
};
function mensajeError(r) {
  if (r.no_permitidas?.length) return 'Hay compras canceladas: reactívalas antes de marcarlas como pagadas.';
  return ERRORES[r.error] || ('No se pudo completar: ' + (r.error || 'error desconocido'));
}

// --- API ---
async function api(ruta, opciones = {}) {
  const headers = { 'X-Panel-Key': estado.clave };
  if (opciones.body) headers['Content-Type'] = 'application/json';
  let r;
  try {
    r = await fetch(API + ruta, { ...opciones, headers, body: opciones.body ? JSON.stringify(opciones.body) : undefined });
  } catch (e) {
    throw new Error('No hay conexión con n8n. ¿Está encendido?');
  }
  const texto = await r.text();
  if (r.status === 403) { cerrarSesion('La clave no es correcta.'); throw new Error('Clave incorrecta'); }
  let data;
  try { data = JSON.parse(texto); } catch { data = { ok: false, error: texto || ('HTTP ' + r.status) }; }
  data._status = r.status;
  return data;
}
const consulta = (q, params = {}) => api('/consulta?' + new URLSearchParams({ q, ...params }));
const accion = (body) => api('/accion', { method: 'POST', body });

// Confirmación con modal. Devuelve {nota, ...campos} o null si se cancela.
// Se resuelve al enviar el formulario (no con el evento 'close', que algunos navegadores
// no disparan mientras la ventana no se está dibujando).
function confirmar({ titulo, texto, campos = '', boton = 'Confirmar' }) {
  return new Promise((resolve) => {
    const dlg = $('dlg-confirmar');
    const form = $('form-confirmar');
    $('conf-titulo').textContent = titulo;
    $('conf-texto').innerHTML = texto;
    $('conf-campos').innerHTML = campos;
    $('conf-nota').value = '';
    $('conf-ok').textContent = boton;
    const terminar = (ok) => {
      form.removeEventListener('submit', alEnviar);
      dlg.removeEventListener('cancel', alCancelar);
      const datos = { nota: $('conf-nota').value };
      dlg.querySelectorAll('[data-campo]').forEach((el) => {
        datos[el.dataset.campo] = el.type === 'checkbox' ? el.checked : el.value;
      });
      if (dlg.open) dlg.close();
      resolve(ok ? datos : null);
    };
    const alEnviar = (ev) => { ev.preventDefault(); terminar(ev.submitter?.value === 'ok'); };
    const alCancelar = (ev) => { ev.preventDefault(); terminar(false); };
    form.addEventListener('submit', alEnviar);
    dlg.addEventListener('cancel', alCancelar);
    dlg.showModal();
  });
}
const chkAvisar = (marcado = true, texto = 'Avisar al cliente por WhatsApp') =>
  `<label><input type="checkbox" data-campo="notificar_cliente" ${marcado ? 'checked' : ''}> ${texto}</label>`;

// Ejecuta una acción del panel y refresca.
async function hacer(body, exito) {
  try {
    const r = await accion(body);
    if (!r.ok) { toast(mensajeError(r), true); return null; }
    toast(typeof exito === 'function' ? exito(r) : exito);
    await refrescar();
    return r;
  } catch (e) {
    if (e.message !== 'Clave incorrecta') toast(e.message, true);
    return null;
  }
}

  $('vista-app').hidden = true;
  $('vista-login').hidden = false;
  $('login-error').textContent = msg;
  $('input-clave').focus();
}
function cerrarSesion(msg = '') {
  estado.clave = '';
  guardarClave('');
  document.querySelectorAll('dialog[open]').forEach((d) => d.close());
  mostrarLogin(msg);
}
$('form-login').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  estado.clave = $('input-clave').value.trim();
  $('login-error').textContent = '';
  try {
    const r = await consulta('lives');
    if (!r.ok) throw new Error(r.error || 'Error');
    guardarClave(estado.clave);
    $('input-clave').value = '';
    entrar();
  } catch (e) {
    if (e.message !== 'Clave incorrecta') $('login-error').textContent = e.message;

});

// --- Live ---
async function cargarLives() {
  const r = await consulta('lives');
  if (!r.ok) return;
  estado.lives = r.lives;
  if (!estado.live || !r.lives.some((l) => l.live_id === estado.live)) estado.live = r.activo || r.lives[0]?.live_id || '';
  const sel = $('sel-live');
  sel.innerHTML = r.lives.length
    ? r.lives.map((l) => `<option value="${esc(l.live_id)}">${esc(l.titulo || 'Live')} · ${dia(l.fecha_operativa)} · ${esc(l.live_id)}${l.estado === 'activo' ? ' (en vivo)' : ''}</option>`).join('')
    : '<option value="">Todavía no hay lives</option>';
  sel.value = estado.live;
  const activo = r.lives.find((l) => l.estado === 'activo');
  $('btn-live').textContent = activo ? 'Cerrar live' : 'Iniciar live';
  $('btn-live').dataset.modo = activo ? 'cerrar' : 'iniciar';
  pintarLive();
}
function pintarLive() {
  const l = estado.lives.find((x) => x.live_id === estado.live);
  const el = $('estado-live');
  if (!l) { el.textContent = ''; el.className = 'estado-live'; $('kpis').innerHTML = ''; return; }
  el.textContent = l.estado === 'activo' ? '● En vivo' : (l.origen === 'respaldo' ? 'Respaldo' : 'Cerrado');
  el.className = 'estado-live ' + (l.estado === 'activo' ? 'vivo' : 'cerrado');
  const kpi = (v, t) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`;
  $('kpis').innerHTML = kpi(bs(l.vendido), 'Vendido') + kpi(bs(l.cobrado), 'Cobrado') + kpi(bs(l.pendiente), 'Por cobrar')
    + kpi(l.clientes, 'Clientes') + kpi(l.compras, 'Compras') + kpi(l.cuentas_en_revision, 'Por revisar');
}
$('sel-live').addEventListener('change', (ev) => { estado.live = ev.target.value; pintarLive(); refrescarTab(); });
$('btn-live').addEventListener('click', async () => {
  if ($('btn-live').dataset.modo === 'cerrar') {
    const d = await confirmar({ titulo: 'Cerrar el live', texto: 'Las capturas que lleguen después se asociarán a este live durante 12 horas (regla de respaldo).', boton: 'Cerrar live' });
    if (d) await hacer({ accion: 'cerrar_live', nota: d.nota }, 'Live cerrado.');
  } else {
    const d = await confirmar({ titulo: 'Iniciar live', texto: 'Las capturas que lleguen se asociarán a este live.',
      campos: '<label>Título (opcional)<input class="campo" type="text" data-campo="titulo" placeholder="Ej. Live de ropa"></label>', boton: 'Iniciar' });
    if (d) {
      const r = await hacer({ accion: 'iniciar_live', titulo: d.titulo, nota: d.nota }, (x) => 'Live ' + x.live.live_id + ' iniciado.');
      if (r) { estado.live = r.live.live_id; await refrescar(); }
    }
  }
});

// --- Tablero ---
async function cargarCuentas() {
  const r = await consulta('cuentas', estado.live ? { live_id: estado.live } : {});
  if (!r.ok && r._status !== 200) return;
  estado.cuentas = r.cuentas || [];
  if (r.live) {
    const i = estado.lives.findIndex((l) => l.live_id === r.live.live_id);
    if (i >= 0) { estado.lives[i] = r.live; pintarLive(); }
  }
}
function tarjeta(c) {
  const chips = [];
  if (c.estado === 'parcial') chips.push(`<span class="badge e-parcial">Pagó ${bs(c.monto_confirmado)}</span>`);
  if (c.pago_por_verificar) chips.push('<span class="badge b-rep">Comprobante por verificar</span>');
  if (Number(c.en_revision) > 0) chips.push(`<span class="badge b-rev">${c.en_revision} en revisión</span>`);
  if (c.control === 'humano') chips.push('<span class="badge b-rev">La atiendes tú</span>');
  if (c.columna === 'pendientes' && !c.qr_enviado_en) chips.push('<span class="badge e-nueva">Sin QR</span>');
  const motivos = motivosLista(c.motivos);
  return `<button type="button" class="cardc" draggable="${c.columna !== 'pagadas' && c.columna !== 'cerradas'}" data-cuenta="${esc(c.cuenta_id)}" data-columna="${esc(c.columna)}">
    <span class="linea"><span class="nombre">${esc(c.cliente || c.nicknames || 'Cliente')}</span><span class="monto">${bs(c.columna === 'pagadas' ? c.subtotal : c.saldo)}</span></span>
    <span class="meta">${esc(c.nicknames || '')} · ${c.compras} compra${c.compras == 1 ? '' : 's'} · +${esc(c.whatsapp)}</span>
    ${chips.length ? `<span class="chips">${chips.join('')}</span>` : ''}
    ${motivos.length ? `<span class="meta" style="color:var(--rev-fg)">${esc(motivos.join(' · '))}</span>` : ''}
  </button>`;
}
function pintarTablero() {
  const grupos = { pendientes: [], revision: [], pagadas: [], cerradas: [] };
  estado.cuentas.forEach((c) => (grupos[c.columna] || grupos.pendientes).push(c));
  $('tablero').innerHTML = COLUMNAS.map((col) => `
    <section class="columna" data-columna="${col.id}">
      <h2><span>${col.titulo}</span><span>${grupos[col.id].length}</span></h2>
      <div class="cards">${grupos[col.id].map(tarjeta).join('') || '<div class="vacio">Nada aquí.</div>'}</div>
    </section>`).join('');
  const cer = $('cerradas');
  cer.hidden = grupos.cerradas.length === 0;
  cer.querySelector('summary').textContent = 'Canceladas o vencidas (' + grupos.cerradas.length + ')';
  cer.querySelector('.cards').innerHTML = grupos.cerradas.map(tarjeta).join('');
}

// Arrastrar y soltar entre columnas (con confirmación).
let arrastrada = null;
document.addEventListener('dragstart', (ev) => {
  const card = ev.target.closest?.('[data-cuenta]');
  if (!card) return;
  arrastrada = { id: card.dataset.cuenta, desde: card.dataset.columna };
  card.classList.add('arrastrando');
  ev.dataTransfer.effectAllowed = 'move';
  ev.dataTransfer.setData('text/plain', card.dataset.cuenta);
});
document.addEventListener('dragend', (ev) => { ev.target.closest?.('[data-cuenta]')?.classList.remove('arrastrando'); });
$('tablero').addEventListener('dragover', (ev) => {
  const col = ev.target.closest('.columna');
  if (!col || !arrastrada) return;
  ev.preventDefault();
  document.querySelectorAll('.columna').forEach((c) => c.classList.toggle('sobre', c === col));
});
$('tablero').addEventListener('dragleave', (ev) => { if (!ev.relatedTarget?.closest?.('.columna')) document.querySelectorAll('.columna').forEach((c) => c.classList.remove('sobre')); });
$('tablero').addEventListener('drop', async (ev) => {
  const col = ev.target.closest('.columna');
  document.querySelectorAll('.columna').forEach((c) => c.classList.remove('sobre'));
  if (!col || !arrastrada) return;
  ev.preventDefault();
  const { id, desde } = arrastrada;
  arrastrada = null;
  await mover(id, desde, col.dataset.columna);
});

async function mover(cuentaId, desde, hacia, datos) {
  if (desde === hacia) return;
  const c = estado.cuentas.find((x) => x.cuenta_id === cuentaId) || datos;
  if (!c) return;
  const quien = esc(c.cliente || c.nicknames || c.whatsapp);
  if (hacia === 'pagadas') {
    const d = await confirmar({
      titulo: 'Marcar la cuenta como pagada',
      texto: `Cuenta de <b>${quien}</b> por <b>${bs(c.saldo)}</b>. Úsalo solo después de ver el dinero en tu banco o Yape.`,
      campos: chkAvisar(true), boton: 'Marcar pagada' });
    if (d) await hacer({ accion: 'cuenta_pagada', cuenta_id: cuentaId, nota: d.nota, notificar_cliente: d.notificar_cliente }, 'Cuenta marcada como pagada.');
  } else if (hacia === 'revision') {
    const d = await confirmar({ titulo: 'Atender tú a este cliente',
      texto: `El bot dejará de responderle a <b>${quien}</b> hasta que lo devuelvas al agente. Escríbele tú por WhatsApp.`, boton: 'Tomar conversación' });
    if (d) await hacer({ accion: 'cuenta_revision', cuenta_id: cuentaId, nota: d.nota }, 'Ahora atiendes tú a este cliente.');
  } else if (hacia === 'pendientes') {
    if (desde === 'pagadas') { toast('Para reabrir una cuenta pagada, cambia el estado de sus compras desde el detalle.', true); return; }
    await devolverAgente(c.whatsapp, quien, cuentaId);
  }
}
async function devolverAgente(whatsapp, quien, cuentaId) {
  const d = await confirmar({ titulo: 'Devolver al agente',
    texto: `Lo que estaba en revisión de <b>${quien}</b> vuelve a «Confirmada» y el bot retoma la conversación.`,
    campos: '<label><input type="checkbox" data-campo="enviar_qr" checked> Enviarle el QR con su total a pagar</label>', boton: 'Devolver' });
  if (d) await hacer({ accion: 'devolver_agente', cuenta_id: cuentaId, whatsapp, enviar_qr: d.enviar_qr, nota: d.nota },
    (r) => 'El agente retoma la conversación.' + (r.qr_enviado ? ' Se envió el QR (' + bs(r.total_a_pagar) + ').' : ''));
}

// --- Detalle de cuenta ---
async function abrirCuenta(id) {
  estado.cuentaAbierta = id;
  const dlg = $('dlg-cuenta');
  if (!dlg.open) { $('cuenta-titulo').textContent = 'Cargando…'; $('cuenta-body').innerHTML = ''; dlg.showModal(); }
  try {
    const d = await consulta('cuenta', { id });
    if (!d.ok) { $('cuenta-body').innerHTML = '<div class="vacio">No se encontró la cuenta.</div>'; return; }
    pintarCuenta(d);
  } catch (e) {
    if (e.message !== 'Clave incorrecta') $('cuenta-body').innerHTML = `<div class="vacio">${esc(e.message)}</div>`;
  }
}

function base64ABlobUrl(b64, mime) {
  return URL.createObjectURL(new Blob([Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0))], { type: mime }));
}

$('cuenta-body').addEventListener('click', async (ev) => {
  const info = JSON.parse($('cuenta-body').dataset.info || '{}');
  const b = ev.target.closest('button');
  if (!b) return;

  if (b.dataset.verComprobante) {
    const caja = b.parentElement;
    caja.innerHTML = '<span class="hint">Cargando…</span>';
    const r = await api('/comprobante?pago_id=' + encodeURIComponent(b.dataset.verComprobante));
    if (!r.ok) { caja.innerHTML = '<span class="hint">No se pudo cargar.</span>'; return; }
    const url = base64ABlobUrl(r.comprobante_base64, r.mime_type);
    caja.innerHTML = r.tipo === 'pdf'
      ? `<a class="btn small" href="${url}" target="_blank" rel="noopener" download="comprobante.pdf">Abrir comprobante (PDF)</a>`
      : `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Comprobante de pago"></a>`;
    return;
  }
  if (b.dataset.verCaptura) {
    const caja = $('cuenta-body').querySelector(`[data-captura-img="${CSS.escape(b.dataset.verCaptura)}"]`);
    caja.innerHTML = '<span class="hint">Cargando…</span>';
    const r = await consulta('captura_imagen', { id: b.dataset.verCaptura });
    if (!r.ok) { caja.innerHTML = '<span class="hint">No hay imagen guardada.</span>'; return; }
    const url = base64ABlobUrl(r.imagen_base64, r.mime_type);
    caja.innerHTML = `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="Captura del live"></a>`;
    b.remove();
    return;
  }
  if (b.dataset.compra) { abrirCompra(b.dataset.compra); return; }
  if (b.dataset.confirmarPago) {
    const d = await confirmar({
      titulo: 'Confirmar pago',
      texto: 'Escribe el monto que <b>viste en tu banco o Yape</b>. Si es menor a lo que debe, la cuenta queda con pago parcial.',
      campos: `<label>Monto recibido (Bs)<input class="campo" inputmode="decimal" data-campo="monto" value="${esc(b.dataset.monto)}"></label>` + chkAvisar(true),
      boton: 'Confirmar pago' });
    if (!d) return;
    const monto = String(d.monto).replace(',', '.').trim();
    if (!/^\d+(\.\d{1,2})?$/.test(monto) || Number(monto) <= 0) { toast('El monto no es válido.', true); return; }
    await hacer({ accion: 'confirmar_pago', pago_id: b.dataset.confirmarPago, monto, nota: d.nota, notificar_cliente: d.notificar_cliente },
      (r) => 'Pago confirmado.' + (Number(r.saldo_pendiente) > 0 ? ' Le falta pagar ' + bs(r.saldo_pendiente) + '.' : ' Cuenta al día.'));
    return;
  }

  const acc = b.dataset.acc;
  const datos = { cuenta_id: info.cuenta_id, whatsapp: info.whatsapp, cliente: info.quien, saldo: info.saldo };
  if (acc === 'pagada') await mover(info.cuenta_id, 'pendientes', 'pagadas', datos);
  else if (acc === 'tomar') await mover(info.cuenta_id, 'pendientes', 'revision', datos);
  else if (acc === 'devolver') await devolverAgente(info.whatsapp, esc(info.quien), info.cuenta_id);
  else if (acc === 'qr') {
    const d = await confirmar({ titulo: 'Reenviar el QR', texto: `Se enviará el QR a <b>${esc(info.quien)}</b> con su total a pagar (${bs(info.total)}).`, boton: 'Enviar' });
    if (d) await hacer({ accion: 'reenviar_qr', cuenta_id: info.cuenta_id, nota: d.nota }, 'QR enviado.');
  } else if (acc === 'nombre') {
    await hacer({ accion: 'cliente_editar', whatsapp: info.whatsapp, nombre_real: $('nombre-real').value }, 'Nombre guardado.');
  }
});

// --- Compras (lista) ---
async function cargarCompras() {
  const q = estado.filtro ? '?estado=' + encodeURIComponent(estado.filtro) : '';
  const [res, lista] = await Promise.all([api('/resumen'), api('/compras' + q)]);
  if (res.ok) estado.resumen = res;
  if (lista.ok) estado.compras = lista.compras;
  const r = estado.resumen || {};
  $('filtros').innerHTML = ORDEN_FILTROS.map((f) => `<button type="button" class="chip${estado.filtro === f ? ' activo' : ''}" data-filtro="${f}">${esc(f ? ESTADOS[f] : 'Todas')} <b>${f ? (r[f] ?? 0) : (r.total ?? 0)}</b></button>`).join('');
  pintarCompras();
}
$('filtros').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-filtro]');
  if (b) { estado.filtro = b.dataset.filtro; cargarCompras(); }
});
$('buscar').addEventListener('input', pintarCompras);
function pintarCompras() {
  const q = $('buscar').value.trim().toLowerCase();
  const items = estado.compras.filter((c) => !q || String(c.nickname || '').toLowerCase().includes(q) || String(c.whatsapp || '').includes(q));
  $('lista').innerHTML = items.length ? items.map((c) => {
    const motivos = motivosLista(c.motivo_revision);
    return `<button type="button" class="item" data-compra="${esc(c.captura_id)}">
      <span class="nick">${esc(c.nickname || 'Sin nickname')}</span><span class="precio">${bs(c.precio)}</span>
      <span class="meta">${badge(c.estado_captura)} · +${esc(c.whatsapp)} · ${hace(c.fecha_recepcion)}</span><span></span>
      ${c.estado_captura === 'requiere_revision' && motivos.length ? `<span class="meta" style="grid-column:1/-1;color:var(--rev-fg)">${esc(motivos.join(' · '))}</span>` : ''}
    </button>`;
  }).join('') : `<div class="vacio">${q ? 'Ninguna compra coincide con la búsqueda.' : 'No hay compras en este estado.'}</div>`;
}
$('lista').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-compra]');
  if (b) abrirCompra(b.dataset.compra);
});

// --- Detalle de una compra (editar, cambiar estado) ---
async function abrirCompra(id) {
  estado.compraAbierta = id;
  const dlg = $('dlg-compra');
  if (!dlg.open) { $('compra-titulo').textContent = 'Cargando…'; $('compra-body').innerHTML = ''; dlg.showModal(); }
  const d = await api('/compra?id=' + encodeURIComponent(id));
  if (!d.ok) { $('compra-body').innerHTML = '<div class="vacio">No se encontró la compra.</div>'; return; }
  const c = d.compra;
  $('compra-titulo').textContent = (c.nickname || 'Sin nickname') + ' · ' + bs(c.precio);
  const precioBloqueado = ['pago_reportado', 'pagada'].includes(c.estado_captura);
  const destinos = ['confirmada', 'requiere_revision', 'nueva', 'cancelada'].filter((e) => e !== c.estado_captura);
  $('compra-body').innerHTML = `
    <div class="sec"><h3>Compra</h3><dl class="kv">
      <dt>Estado</dt><dd>${badge(c.estado_captura)}</dd><dt>Nickname</dt><dd>${esc(c.nickname || '—')}</dd>
      <dt>Precio</dt><dd>${bs(c.precio)}</dd><dt>Recibida</dt><dd>${fecha(c.fecha_recepcion)}</dd>
      <dt>Lectura de la IA</dt><dd>${c.confianza != null ? Math.round(c.confianza * 100) + '% de confianza' : '—'}</dd>
      <dt>WhatsApp</dt><dd>+${esc(c.whatsapp)}</dd>
    </dl></div>
    <div class="sec"><h3>Acciones</h3><div class="acciones">
      ${!['pagada', 'cancelada'].includes(c.estado_captura) ? `<div class="accion"><strong>Marcar solo esta compra como pagada</strong>
        <label><input type="checkbox" id="c-avisar" checked> Avisar al cliente por WhatsApp</label>
        <div class="fila"><button class="btn primary" type="button" data-c="pagar">Marcar como pagada</button></div></div>` : ''}
      <div class="accion"><strong>Cambiar estado</strong><div class="fila">
        <select class="campo" id="c-estado">${destinos.map((e) => `<option value="${e}">${esc(ESTADOS[e])}</option>`).join('')}</select>
        <input class="campo" id="c-nota" placeholder="Nota (opcional)">
        <button class="btn" type="button" data-c="estado">Cambiar</button></div>
        ${c.estado_captura === 'pagada' ? '<span class="hint">Si la sacas de «Pagada», su pago vuelve a quedar pendiente de verificar.</span>' : ''}</div>
      <div class="accion"><strong>Corregir datos</strong><div class="fila">
        <input class="campo" id="c-nick" value="${esc(c.nickname || '')}" placeholder="Nickname">
        <input class="campo" id="c-precio" value="${esc(c.precio ?? '')}" inputmode="decimal" placeholder="Precio" ${precioBloqueado ? 'disabled' : ''}>
        <button class="btn" type="button" data-c="editar">Guardar</button></div>
        ${precioBloqueado ? '<span class="hint">El precio no se puede cambiar con un pago reportado o confirmado. Pasa la compra a «Requiere revisión» primero.</span>' : ''}</div>
    </div></div>`;
}
$('dlg-compra').addEventListener('close', () => { estado.compraAbierta = null; });
$('compra-body').addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-c]');
  if (!b) return;
  const id = estado.compraAbierta;
  let r;
  try {
    if (b.dataset.c === 'pagar') {
      const d = await confirmar({ titulo: 'Marcar compra pagada', texto: 'Úsalo solo después de ver el dinero en tu banco o Yape.', boton: 'Marcar pagada' });
      if (!d) return;
      r = await api('/compra/marcar-pagada', { method: 'POST', body: { ids: [id], nota: d.nota, notificar_cliente: $('c-avisar').checked } });
      if (r.ok) toast('Compra marcada como pagada.');
    } else if (b.dataset.c === 'estado') {
      const nuevo = $('c-estado').value;
      if (nuevo === 'cancelada' && !(await confirmar({ titulo: 'Cancelar compra', texto: 'La compra deja de contar para el cobro.', boton: 'Cancelar compra' }))) return;
      r = await api('/compra/cambiar-estado', { method: 'POST', body: { id, estado: nuevo, nota: $('c-nota').value } });
      if (r.ok) toast('Estado cambiado a «' + ESTADOS[r.estado_nuevo] + '».');
    } else {
      r = await api('/compra/editar', { method: 'POST', body: { id, nickname: $('c-nick').value, precio: $('c-precio').disabled ? '' : $('c-precio').value } });
      if (r.ok) toast(r.cambio ? 'Datos guardados.' : 'No había cambios.');
    }
    if (r && !r.ok) toast(mensajeError(r), true);
    await refrescar();
    if (estado.compraAbierta) await abrirCompra(id);
  } catch (e) {
    if (e.message !== 'Clave incorrecta') toast(e.message, true);
  }
});

// --- Reporte ---
function pintarReporte() {
  const l = estado.lives.find((x) => x.live_id === estado.live);
  if (!l) { $('reporte').innerHTML = '<div class="vacio">No hay lives todavía.</div>'; return; }
  const filas = estado.cuentas.map((c) => `<tr>
    <td>${esc(c.cliente || '—')}<br><span class="hint">+${esc(c.whatsapp)}</span></td><td>${esc(c.nicknames || '')}</td>
    <td class="num">${c.compras}</td><td class="num">${bs(c.subtotal)}</td><td class="num">${bs(c.monto_confirmado)}</td>
    <td class="num">${bs(['cancelada', 'vencida'].includes(c.estado) ? 0 : c.saldo)}</td><td>${badge(c.estado, ESTADOS_CUENTA)}</td></tr>`).join('');
  $('reporte').innerHTML = `
    <div class="sec" style="margin-bottom:12px"><h3>${esc(l.titulo || 'Live')} · ${dia(l.fecha_operativa)} · ${esc(l.live_id)}</h3>
      <dl class="kv"><dt>Inicio</dt><dd>${fecha(l.inicio)}</dd><dt>Cierre</dt><dd>${l.cierre ? fecha(l.cierre) : 'En curso'}</dd>
      <dt>Vendido</dt><dd>${bs(l.vendido)}</dd><dt>Cobrado (verificado)</dt><dd>${bs(l.cobrado)}</dd>
      <dt>Por cobrar</dt><dd>${bs(l.pendiente)}</dd><dt>Clientes / compras</dt><dd>${l.clientes} / ${l.compras}</dd>
      <dt>Cuentas pagadas</dt><dd>${l.cuentas_pagadas} de ${estado.cuentas.length}</dd></dl></div>
    <div class="tabla-scroll"><table class="tabla"><thead><tr><th>Cliente</th><th>Nicknames</th><th class="num">Compras</th><th class="num">Total</th><th class="num">Pagado</th><th class="num">Saldo</th><th>Estado</th></tr></thead>
    <tbody>${filas || '<tr><td colspan="7" class="vacio">Sin cuentas.</td></tr>'}</tbody></table></div>`;
}
$('btn-csv').addEventListener('click', () => {
  const l = estado.lives.find((x) => x.live_id === estado.live);
  if (!l) return;
  const celda = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const filas = [['Live', 'Fecha', 'Cuenta', 'Cliente', 'WhatsApp', 'Nicknames', 'Compras', 'Total Bs', 'Pagado Bs', 'Saldo Bs', 'Estado']]
    .concat(estado.cuentas.map((c) => [l.live_id, l.fecha_operativa, c.cuenta_id, c.cliente, c.whatsapp, c.nicknames, c.compras,
      c.subtotal, c.monto_confirmado, ['cancelada', 'vencida'].includes(c.estado) ? 0 : c.saldo, ESTADOS_CUENTA[c.estado] || c.estado]));
  const csv = '﻿' + filas.map((f) => f.map(celda).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'reporte-' + l.live_id + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

// --- Refresco ---
async function refrescarTab() {
  try {
    if (estado.tab === 'tablero') { await cargarCuentas(); pintarTablero(); }
    else if (estado.tab === 'compras') await cargarCompras();
    else { await cargarCuentas(); pintarReporte(); }
    $('actualizado').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    if (e.message !== 'Clave incorrecta') toast(e.message, true);
  }
}
async function refrescar() {
  try { await cargarLives(); } catch (e) { if (e.message !== 'Clave incorrecta') toast(e.message, true); }
  await refrescarTab();
  if (estado.cuentaAbierta) await abrirCuenta(estado.cuentaAbierta);
}
$('btn-recargar').addEventListener('click', refrescar);

let intervalo;
function entrar() {
  $('vista-login').hidden = true;
  $('vista-app').hidden = false;
  refrescar();
  clearInterval(intervalo);
  // Refresca cada 30 s para ver compras y pagos nuevos durante el live (sin interrumpir un modal abierto).
  intervalo = setInterval(() => {
    if (!document.hidden && estado.clave && !$('dlg-confirmar').open && !estado.cuentaAbierta && !estado.compraAbierta) refrescar();
  }, 30000);
}

estado.clave = leerClave();
if (estado.clave) entrar(); else mostrarLogin();
</script>
